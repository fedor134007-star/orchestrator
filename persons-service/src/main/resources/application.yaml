server:
  port: 8092
  shutdown: graceful

spring:
  application:
    name: person-service

  # Рабочий доступ к БД — реактивный (R2DBC, неблокирующий драйвер)
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:person}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  # JDBC-подключение нужно только Flyway: миграции применяются синхронно при старте,
  # до того как сервис начнёт принимать запросы. Схему person выставляет default-schema.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:person}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      pool-name: person-service-flyway-pool
      maximum-pool-size: 2
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: person
    default-schema: person
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_EXPORTER_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    description: Person domain service (module 2, WebFlux + R2DBC)
    version: 1.0.0

logging:
  level:
    root: INFO
    com.example.persons_service: DEBUG
