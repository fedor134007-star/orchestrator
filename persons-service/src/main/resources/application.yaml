server:
  port: 8092
  shutdown: graceful

spring:
  application:
    name: person-service

  # Все значения (БД, пул, OTLP, трейсинг) вынесены в person-service.properties.
  config:
    import: optional:classpath:person-service.properties

  datasource:
    url: ${person-service.datasource.url}
    username: ${person-service.datasource.username}
    password: ${person-service.datasource.password}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: person
    default-schema: person
    validate-on-migrate: true
    clean-disabled: true

  # Запрос к несуществующему пути должен попадать в @RestControllerAdvice как
  # NoResourceFoundException и отдавать RFC 9457, а не пустую страницу /error.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: read_only
  tracing:
    sampling:
      probability: ${person-service.tracing.sampling}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${person-service.otlp.endpoint}
  otlp:
    metrics:
      export:
        # Метрики отдаёт Prometheus; дублирующий OTLP-экспорт отключён.
        enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Person domain service (module 2, Spring MVC + JPA)
    version: 1.0.0

logging:
  level:
    root: INFO
    com.example.persons_service: DEBUG
