# ============================================================
# Значения конфигурации person-service, вынесенные из application.yaml.
# Типизация и валидация — в config/PersonServiceProperties (prefix person-service).
# ============================================================

# Подключение к базе данных (JDBC: рабочий доступ + Flyway)
person-service.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:person}
person-service.datasource.username=${POSTGRES_USER:postgres}
person-service.datasource.password=${POSTGRES_PASSWORD:postgres}

# Пул соединений HikariCP (см. DataSourceConfiguration: значения типизированы в PersonServiceProperties)
person-service.pool.initial-size=5
person-service.pool.max-size=20
person-service.pool.max-idle-time=30m

# Наблюдаемость
person-service.otlp.endpoint=${OTLP_EXPORTER_ENDPOINT:http://localhost:4318/v1/traces}
person-service.tracing.sampling=${TRACING_SAMPLING_PROBABILITY:1.0}
