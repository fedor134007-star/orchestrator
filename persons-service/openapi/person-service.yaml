openapi: 3.0.3
info:
  title: Person Service API
  description: |
    API управления агрегатом пользователя платформы: учётная запись (users),
    адрес (addresses) и индивидуальные данные (individuals).

    Сервис является источником правды для пользовательских данных.
    Регистрация в Keycloak выполняется внешним оркестратором (individuals-api)
    и не входит в ответственность этого сервиса.
  version: 1.0.0

servers:
  - url: http://localhost:8092
    description: Локальный стенд разработчика

tags:
  - name: Users
    description: Операции над агрегатом пользователя

paths:
  # ============================================
  # Создание пользователя
  # ============================================
  /api/v1/users:
    post:
      tags:
        - Users
      summary: Создать пользователя
      description: |
        Транзакционно создаёт агрегат: учётную запись, адрес и индивидуальные данные.
        Email уникален без учёта регистра.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: ivan.petrov@example.org
              firstName: Иван
              lastName: Петров
              address:
                countryAlpha3: RUS
                countryAlpha2: RU
                city: Moscow
                state: Moscow
                zipCode: "101000"
                addressLine: ул. Пример, д. 1
              individual:
                passportNumber: "1234 567890"
                phoneNumber: "+79991234567"
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Получение пользователя по email
  # ============================================
  /api/v1/users/by-email:
    get:
      tags:
        - Users
      summary: Получить пользователя по email
      description: Поиск пользователя по email без учёта регистра.
      operationId: getUserByEmail
      parameters:
        - name: email
          in: query
          required: true
          description: Email пользователя
          schema:
            type: string
            format: email
            maxLength: 1024
          example: ivan.petrov@example.org
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================
  # Работа с пользователем по идентификатору
  # ============================================
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Получить пользователя по идентификатору
      description: Возвращает агрегат целиком.
      operationId: getUserById
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Users
      summary: Изменить пользователя
      description: |
        Частичное обновление агрегата с аудитом изменений.

        Изменяются только поля, присутствующие в запросе; отсутствующие поля
        (в том числе вложенные) сохраняют текущее значение.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              firstName: Иван
              lastName: Петров-Старший
              address:
                city: Saint Petersburg
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Users
      summary: Удалить пользователя
      description: |
        Транзакционно удаляет агрегат: учётную запись, адрес и индивидуальные данные.
        История изменений сохраняется в аудитных таблицах Envers.
      operationId: deleteUser
      responses:
        '204':
          description: Пользователь удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Ошибка формата или валидации запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    NotFound:
      description: Пользователь не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    Conflict:
      description: Конфликт данных (email уже занят)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    InternalServerError:
      description: Непредвиденная ошибка
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'

  schemas:
    # ------------------------------------------
    # Запросы
    # ------------------------------------------
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
          description: Email пользователя, уникальный без учёта регистра
          example: ivan.petrov@example.org
        firstName:
          type: string
          minLength: 1
          maxLength: 64
          example: Иван
        lastName:
          type: string
          minLength: 1
          maxLength: 64
          example: Петров
        address:
          $ref: '#/components/schemas/CreateAddressRequest'
        individual:
          $ref: '#/components/schemas/CreateIndividualRequest'

    CreateAddressRequest:
      type: object
      additionalProperties: false
      required:
        - countryAlpha3
        - countryAlpha2
        - city
        - addressLine
      properties:
        countryAlpha3:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Код страны ISO 3166-1 alpha-3
          example: RUS
        countryAlpha2:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Код страны ISO 3166-1 alpha-2
          example: RU
        city:
          type: string
          minLength: 1
          maxLength: 64
          example: Moscow
        state:
          type: string
          maxLength: 64
          example: Moscow
        zipCode:
          type: string
          maxLength: 32
          example: "101000"
        addressLine:
          type: string
          minLength: 1
          maxLength: 128
          example: ул. Пример, д. 1

    CreateIndividualRequest:
      type: object
      additionalProperties: false
      properties:
        passportNumber:
          type: string
          maxLength: 32
          example: "1234 567890"
        phoneNumber:
          type: string
          maxLength: 32
          example: "+79991234567"

    UpdateUserRequest:
      type: object
      additionalProperties: false
      description: |
        Частичное обновление. Отсутствующее поле не изменяется.
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
          example: ivan.petrov@example.org
        firstName:
          type: string
          minLength: 1
          maxLength: 64
          example: Иван
        lastName:
          type: string
          minLength: 1
          maxLength: 64
          example: Петров-Старший
        address:
          $ref: '#/components/schemas/UpdateAddressRequest'
        individual:
          $ref: '#/components/schemas/UpdateIndividualRequest'

    UpdateAddressRequest:
      type: object
      additionalProperties: false
      description: Частичное обновление адреса. Отсутствующее поле не изменяется.
      properties:
        countryAlpha3:
          type: string
          pattern: '^[A-Z]{3}$'
          example: RUS
        countryAlpha2:
          type: string
          pattern: '^[A-Z]{2}$'
          example: RU
        city:
          type: string
          minLength: 1
          maxLength: 64
          example: Saint Petersburg
        state:
          type: string
          maxLength: 64
          example: Saint Petersburg
        zipCode:
          type: string
          maxLength: 32
          example: "190000"
        addressLine:
          type: string
          minLength: 1
          maxLength: 128
          example: Невский проспект, д. 1

    UpdateIndividualRequest:
      type: object
      additionalProperties: false
      description: Частичное обновление индивидуальных данных. Отсутствующее поле не изменяется.
      properties:
        passportNumber:
          type: string
          maxLength: 32
          example: "1234 567890"
        phoneNumber:
          type: string
          maxLength: 32
          example: "+79991234567"
        status:
          $ref: '#/components/schemas/IndividualStatus'

    # ------------------------------------------
    # Ответы
    # ------------------------------------------
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - firstName
        - lastName
        - filled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: |
            Идентификатор пользователя в доменной модели.
            Оркестратор передаёт его в Keycloak как атрибут user_uid.
        email:
          type: string
          format: email
          maxLength: 1024
        firstName:
          type: string
          maxLength: 64
        lastName:
          type: string
          maxLength: 64
        filled:
          type: boolean
          description: Признак того, что заполнены и адрес, и индивидуальные данные
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        address:
          $ref: '#/components/schemas/AddressResponse'
        individual:
          $ref: '#/components/schemas/IndividualResponse'

    AddressResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - countryAlpha3
        - countryAlpha2
        - city
        - addressLine
      properties:
        id:
          type: string
          format: uuid
        countryAlpha3:
          type: string
          pattern: '^[A-Z]{3}$'
        countryAlpha2:
          type: string
          pattern: '^[A-Z]{2}$'
        city:
          type: string
          maxLength: 64
        state:
          type: string
          maxLength: 64
          nullable: true
        zipCode:
          type: string
          maxLength: 32
          nullable: true
        addressLine:
          type: string
          maxLength: 128

    IndividualResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        passportNumber:
          type: string
          maxLength: 32
          nullable: true
        phoneNumber:
          type: string
          maxLength: 32
          nullable: true
        status:
          $ref: '#/components/schemas/IndividualStatus'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true

    IndividualStatus:
      type: string
      description: Статус индивидуальных данных
      enum:
        - NEW
        - VERIFIED
        - ARCHIVED

    # ------------------------------------------
    # Ошибки (RFC 9457)
    # ------------------------------------------
    ProblemResponse:
      type: object
      additionalProperties: false
      description: Ответ об ошибке в формате RFC 9457 Problem Details
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI типа проблемы
          example: https://example.org/problems/email-already-exists
        title:
          type: string
          example: Конфликт данных
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 409
        detail:
          type: string
          example: Пользователь с таким email уже существует
        instance:
          type: string
          example: /api/v1/users
        errors:
          type: object
          additionalProperties:
            type: string
          description: Детализация ошибок валидации по полям (расширение RFC 9457)
