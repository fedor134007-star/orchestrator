services:

  # сервис оркестратор
  individuals-api:
    build:
      context: ./individuals-api
      dockerfile: Dockerfile
      args:
        NEXUS_URL: ${NEXUS_URL:-http://host.docker.internal:8081/repository/maven}
        NEXUS_GROUP_URL: ${NEXUS_GROUP_URL:-http://host.docker.internal:8081/repository/maven-public}
        NEXUS_USERNAME: ${NEXUS_USERNAME:-admin}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD:-admin}
    container_name: individuals-api
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: individual
      KEYCLOAK_CLIENT_SECRET: lBO6Dz0IJXoNxqfZNPhf4qGxFB0HytaV
      KEYCLOAK_CLIENT_ID: individuals-api
      SPRING_PROFILES_ACTIVE: docker
      PERSONS_API_HOST: persons-service
      PERSONS_SERVICE_URL: http://persons-service:8092
      # OTLP/HTTP приёмник — Alloy (у Tempo нет слушателя на 4318)
      OTLP_EXPORTER_ENDPOINT: http://alloy:4318
    ports:
      - "8091:8091"

    depends_on:
      nexus:
        condition: service_healthy
      # persons-service вызывается на каждом запросе: стартуем после его готовности
      persons-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # для individual-api keycloak (система авторизации)
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: individuals-keycloak
    command: start-dev --import-realm --metrics-enabled=true
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      JAVA_OPTS: -Dkeycloak.migration.usersExportStrategy=REALM_FILE
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infrastructure/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # database for keycloak
  keycloak-postgres:
    image: postgres:17
    container_name: keycloak-postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 20


  # export keycloak data in prometheus
  keycloak-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: keycloak-postgres-exporter
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://keycloak:keycloak@keycloak-postgres:5432/keycloak?sslmode=disable
    ports:
      - "9189:9187"

  # person-service (модуль 2): источник правды по пользовательским данным
  persons-service:
    build:
      context: ./persons-service
      dockerfile: Dockerfile
    container_name: persons-service
    ports:
      # 8092 — адрес, на котором сервис слушает (и куда смотрит individuals-api)
      - "8092:8092"
      # 8082 — алиас, чтобы команды проверки из ТЗ модуля 2 работали как есть
      - "8082:8092"
    environment:
      # Сервис не знает о Keycloak: только БД и телеметрия.
      POSTGRES_HOST: person-service-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: person
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # OTLP/HTTP приёмник — Alloy, который перекладывает трейсы в Tempo
      OTLP_EXPORTER_ENDPOINT: http://alloy:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      person-service-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8092/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # для person service database
  person-service-postgres:
    image: postgres:17
    container_name: person-service-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: person
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20

  # export data in prometheus
  person-service-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: person-service-postgres-exporter
    depends_on:
      person-service-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@person-service-postgres:5432/person?sslmode=disable
    ports:
      - "9188:9187"

  # хранилище артефактов (Maven-зависимости, Docker-образы и др.)
  nexus:
    image: sonatype/nexus3:3.93.0
    container_name: nexus
    ports:
      - "8081:8081"
    environment:
      NEXUS_SECURITY_INITIAL_PASSWORD: admin
      NEXUS_SECURITY_RANDOMPASSWORD: false
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status/writable" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # мониторинг
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # сбор логов
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # сбор трейсов
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  # Агент сбора телеметрии: собирает логи контейнеров → Loki, принимает трейсы по OTLP → Tempo
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    ports:
      - "9080:9080" # HTTP interface
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  # Eдиная панель визуализации всей телеметрии
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  artifacts:
  tempo_data:
  nexus-data:
  loki_data:
  loki_chunks:
  loki_index:
  loki_rules:
  swagger_data: